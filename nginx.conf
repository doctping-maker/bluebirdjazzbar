# Nginx server configuration for Bluebird Jazz Bar
# To use: Copy this file to `/etc/nginx/sites-available/bluebird-jazz-bar` on your VPS, 
# then create a symlink to it in `/etc/nginx/sites-enabled/`.

server {
    listen 80;
    listen [::]:80;
    
    # Replace with your actual domain name
    server_name yourdomain.com www.yourdomain.com;

    # Redirect www to non-www
    if ($host = www.yourdomain.com) {
        return 301 http://yourdomain.com$request_uri;
    }

    # Root directory (matches REMOTE_DIR in deploy_config.env)
    root /var/www/bluebird-jazz-bar;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Clean URLs for Next.js static exports
    # Attempts to serve URL, then URL.html, then directory, and falls back to 404
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }

    # Custom 404 error page handling
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Caching headers for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}
